services:
  - type: web
    name: ai-interviewer-backend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install gunicorn && pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10

staticSites:
  - name: ai-interviewer-frontend
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://ai-interviewer-backend.onrender.com
